<body>
    <h1>Selecione seu jogador</h1>

    <div class="painel">
        <button class="painel-btn" id="left">◀</button>

        <div class="player-1 off">
            <img src="/sprites/Character 1/sprite1.png" alt="Character1">
        </div>

        <div class="player-2 on">
            <img src="/sprites/Character 2/sprite2.png" alt="">
        </div>

        <div class="player-3 off">
            <img src="/sprites/Character 3/sprite1.png" alt="">
        </div>
        
        <button class="painel-btn" id="right">▶</button>
    </div>

    <div class="select-box">
    <button class="select" id="jogar">Jogar</button>
    <a href="/Infinity run/index.html"></a>
    </div>

    <script src="script.js"></script>
</body>
