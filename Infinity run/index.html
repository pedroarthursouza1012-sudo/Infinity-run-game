<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
 

<title>Jogo</title>
</head>
<body id="body">
    <button id="back">◀ Voltar</button>
    <h1>PokeRun</h1>
    
    <div class="tela">

        <div id="gameOver">
            <h2>Game over</h2>
            <p>Pontuação: <span id="pontuacaoFinal">0000000</span></p>

            <button id="jogarNovamente">Jogar novamente</button>
        </div>


        <div id="contadorBox"></div>
        <div class="nuvem"></div>
        <div class="nuvem2"></div>
        <div class="nuvem3"></div>
        <div class="nuvem4"></div>
        <div class="nuvem5"></div>
        <div class="nuvem6"></div>
        
            <div class="montanhas"></div>
            <div class="personagem">
                <img src="" id="player">
            </div>

            <div class="tree">
                <img src="../Infinity run/img/pokemon-fire-red-tree.png" alt="">
            </div>

            <div class="floor">

                <div class="grass">
                    <div class="details"></div>
                </div>
                
            </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
